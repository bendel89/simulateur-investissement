<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulateur d'Investissement</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:#0a0e1a;color:#e8ecf8;min-height:100vh;padding:1rem 1rem 4rem;font-size:15px;line-height:1.5;max-width:900px;margin:0 auto}
h1{text-align:center;font-size:1.5rem;margin-bottom:0.5rem;background:linear-gradient(135deg,#4a9eff,#7c5cff,#d94aff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;font-size:0.82rem;color:#8892b0;margin-bottom:1rem}
.panel{background:#131829;border:1px solid #2a3350;border-radius:12px;padding:1rem;margin-bottom:1rem}
.lbl{display:block;font-size:0.72rem;color:#8892b0;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.06em;font-weight:600}
input{width:100%;padding:0.85rem;border-radius:10px;border:1px solid #2a3350;background:#1a2036;color:#e8ecf8;font-family:inherit;font-size:1rem;margin-bottom:0.9rem;-webkit-appearance:none}
input:focus{outline:none;border-color:#4a9eff}
button.primary{width:100%;padding:1rem;border-radius:12px;border:none;background:linear-gradient(135deg,#4a9eff,#7c5cff);color:#fff;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;margin-top:0.5rem}
button.primary:active{transform:scale(0.98)}
.results{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-bottom:1rem}
.result-item{background:#131829;border:1px solid #2a3350;border-radius:10px;padding:0.9rem}
.result-label{font-size:0.7rem;color:#8892b0;text-transform:uppercase;letter-spacing:0.05em}
.result-value{font-size:1.15rem;font-weight:600;color:#4a9eff;margin-top:0.3rem}
.result-value.green{color:#6ee7a3}
.result-value.red{color:#e07070}
.result-value.purple{color:#b794f6}
canvas{margin-top:0.5rem;max-height:300px}
.footer{text-align:center;font-size:0.7rem;color:#4a5578;margin-top:1rem}
</style>
</head>
<body>

<h1>Simulateur d'Investissement</h1>
<p class="sub">Visualisez la puissance des intérêts composés</p>

<div class="panel">
<label class="lbl" for="capital">💰 Capital initial (CHF)</label>
<input type="number" id="capital" value="1000" min="0" step="100">

<label class="lbl" for="monthly">📅 Apport mensuel (CHF)</label>
<input type="number" id="monthly" value="100" min="0" step="10">

<label class="lbl" for="rate">📈 Taux de rendement annuel (%)</label>
<input type="number" id="rate" value="7" min="0" step="0.1">

<label class="lbl" for="years">⏱️ Durée (années)</label>
<input type="number" id="years" value="10" min="1" max="50">

<button class="primary" onclick="simuler()">Simuler</button>
</div>

<div class="results">
<div class="result-item">
<div class="result-label">Total investi</div>
<div class="result-value" id="totalInvested">0 CHF</div>
</div>
<div class="result-item">
<div class="result-label">Valeur finale</div>
<div class="result-value green" id="finalValue">0 CHF</div>
</div>
<div class="result-item">
<div class="result-label">Bénéfice net</div>
<div class="result-value purple" id="netProfit">0 CHF</div>
</div>
<div class="result-item">
<div class="result-label">Gain total</div>
<div class="result-value" id="gainPercent">0 %</div>
</div>
</div>

<div class="panel">
<canvas id="chart"></canvas>
</div>

<p class="footer">Simulation indicative — pas un conseil financier</p>

<script>
var chartInstance=null;

function formatCHF(v){
return v.toLocaleString('fr-CH',{minimumFractionDigits:0,maximumFractionDigits:0})+' CHF';
}

function simuler(){
var capital=parseFloat(document.getElementById('capital').value)||0;
var monthly=parseFloat(document.getElementById('monthly').value)||0;
var annualRate=parseFloat(document.getElementById('rate').value)||0;
var years=parseInt(document.getElementById('years').value)||1;

var monthlyRate=annualRate/100/12;
var months=years*12;

var labels=[];
var investedData=[];
var valueData=[];

var currentValue=capital;
var totalInvested=capital;

labels.push('0');
investedData.push(capital);
valueData.push(capital);

for(var i=1;i<=months;i++){
currentValue+=monthly;
currentValue*=(1+monthlyRate);
totalInvested+=monthly;

if(i%12===0||i===months){
labels.push((i/12).toFixed(0)+'a');
investedData.push(Math.round(totalInvested));
valueData.push(Math.round(currentValue));
}
}

document.getElementById('totalInvested').innerText=formatCHF(totalInvested);
document.getElementById('finalValue').innerText=formatCHF(currentValue);
document.getElementById('netProfit').innerText=formatCHF(currentValue-totalInvested);
var gain=totalInvested>0?((currentValue-totalInvested)/totalInvested*100):0;
var gainEl=document.getElementById('gainPercent');
gainEl.innerText=gain.toFixed(1)+' %';
gainEl.className='result-value '+(gain>=0?'green':'red');

if(chartInstance)chartInstance.destroy();

var ctx=document.getElementById('chart').getContext('2d');
chartInstance=new Chart(ctx,{
type:'line',
data:{
labels:labels,
datasets:[
{
label:'Total investi',
data:investedData,
borderColor:'#8892b0',
borderWidth:1.5,
fill:false,
pointRadius:0,
tension:0.3
},
{
label:'Valeur du portefeuille',
data:valueData,
borderColor:'#4a9eff',
backgroundColor:'rgba(74,158,255,0.15)',
borderWidth:2.5,
fill:true,
pointRadius:0,
tension:0.3
}
]
},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{
legend:{labels:{color:'#e8ecf8',font:{size:11}}}
},
scales:{
x:{ticks:{color:'#8892b0',font:{size:10}},grid:{color:'#2a3350'}},
y:{ticks:{color:'#8892b0',font:{size:10}},grid:{color:'#2a3350'}}
}
}
});
}

simuler();
</script>
</body>
</html>
